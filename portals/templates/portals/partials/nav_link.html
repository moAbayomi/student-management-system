{% load ui %}
<a href="{{ href }}"
   class="nav-link {% if active %}nav-link-active{% endif %} {% if soon %}nav-link-disabled{% endif %}"
   :class="leftSidebarOpen ? '' : 'justify-center'"
   {% if active %}aria-current="page"{% endif %}
   title="{{ label }}">
	{% icon icon_name %}
	<span x-show="leftSidebarOpen" class="flex-1">{{ label }}</span>
	{% if soon %}
	<span x-show="leftSidebarOpen" class="text-[9.5px] font-bold uppercase tracking-wider text-white/50">Soon</span>
	{% elif badge %}
	<span x-show="leftSidebarOpen" class="px-2 py-0.5 rounded-full bg-primary/25 text-white text-[10px] font-black">{{ badge }}</span>
	{% endif %}
</a>
