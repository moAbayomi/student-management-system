{% if success %}
    <div hx-get="{% url 'edit_teacher_subjects' teacher.id %}" 
         hx-trigger="load delay:2s" 
         hx-target="#subject-form-container"
         class="bg-green-100 text-green-700 p-3 rounded-xl text-xs font-bold mb-4 animate-pulse">
        ✓ Changes saved to production!
    </div>
{% endif %}

<div class="h-64 overflow-y-auto pr-2 border border-slate-200 rounded-2xl p-4 bg-white">
    <form hx-post="{% url 'edit_teacher_subjects' teacher.id %}" 
          hx-target="#subject-form-container" 
          class="space-y-4">
        {% csrf_token %}
        <div class="grid grid-cols-1 gap-2">
            {% for checkbox in form.subjects %}
                <label class="flex items-center p-3 bg-slate-50 border border-slate-100 rounded-xl cursor-pointer hover:border-indigo-300">
                    {{ checkbox.tag }}
                    <span class="ml-3 text-xs font-bold">{{ checkbox.choice_label }}</span>
                </label>
            {% endfor %}
        </div>
        <button type="submit" class="w-full bg-black text-white py-3 rounded-xl text-xs font-black uppercase tracking-widest">
            Save Changes
        </button>
    </form>
</div>
