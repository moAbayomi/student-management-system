<aside
  x-data="{ leftSidebarOpen: true }"
  :class="leftSidebarOpen ? 'w-64' : 'w-16'"
  class="bg-surface-dark text-white h-screen flex-shrink-0 flex flex-col transition-all duration-300 border-r border-border-light overflow-hidden"
>
  <!-- Logo & Teacher Profile Section -->
  <div class="flex items-center justify-between px-4 py-4">
    <div class="flex items-center gap-3" x-show="leftSidebarOpen" x-transition>
      <div class="w-8 h-8 bg-secondary rounded-lg flex items-center justify-center shadow-lg shadow-secondary/20">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-surface)" stroke-width="2.5" stroke-linecap="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
          <path d="M6 12v5c3 3 9 3 12 0v-5" />
        </svg>
      </div>
      <span class="font-bold text-sm">School Portal</span>
    </div>

    <!-- Toggle Button (always visible) -->
    <button
      @click="leftSidebarOpen = !leftSidebarOpen"
      class="ml-auto p-1.5 rounded-md text-white/60 hover:bg-white/10 hover:text-white transition-colors focus:outline-none"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round">
        <path x-show="leftSidebarOpen" d="M11 19l-7-7 7-7" />
        <path x-show="!leftSidebarOpen" d="M13 5l7 7-7 7" />
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-2 mt-2 space-y-1">
    <!-- Dashboard -->
    <a href="{% url 'portal:teacher' %}"
       class="flex items-center gap-3 px-3 py-2.5 rounded-md transition-all group whitespace-nowrap"
       :class="leftSidebarOpen ? 'hover:bg-white/10' : 'justify-center'">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
        <rect x="3" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="3" width="7" height="7" rx="1" />
        <rect x="3" y="14" width="7" height="7" rx="1" />
        <rect x="14" y="14" width="7" height="7" rx="1" />
      </svg>
      <span x-show="leftSidebarOpen" class="text-sm font-medium">Dashboard</span>
    </a>

    <!-- My Timetable -->
    <a href="#"
       class="flex items-center gap-3 px-3 py-2.5 rounded-md text-muted hover:bg-white/10 hover:text-white font-medium text-sm transition-all group whitespace-nowrap"
       :class="leftSidebarOpen ? 'hover:bg-white/10' : 'justify-center'">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="4" width="18" height="18" rx="2" />
        <line x1="16" y1="2" x2="16" y2="6" />
        <line x1="8" y1="2" x2="8" y2="6" />
        <line x1="3" y1="10" x2="21" y2="10" />
      </svg>
      <span x-show="leftSidebarOpen">My Timetable</span>
    </a>

    <!-- Students -->
    <a href="{% url 'portal:my-students' %}"
       class="flex items-center gap-3 px-3 py-2.5 rounded-md text-muted hover:bg-white/10 hover:text-white font-medium text-sm transition-all group whitespace-nowrap"
       :class="leftSidebarOpen ? 'hover:bg-white/10' : 'justify-center'">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
      </svg>
      <span x-show="leftSidebarOpen" class="flex-1">Students</span>
      <span x-show="leftSidebarOpen" class="px-2 py-0.5 rounded-full bg-primary/10 text-primary text-[10px] font-black">35</span>
    </a>

    <!-- Attendance -->
    <a href="{% url 'portal:class-teacher-attendance' %}"
       class="flex items-center gap-3 px-3 py-2.5 rounded-md text-dim hover:bg-white/5 hover:text-white font-medium text-sm transition-all group whitespace-nowrap"
       :class="leftSidebarOpen ? 'hover:bg-white/10' : 'justify-center'">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
      </svg>
      <span x-show="leftSidebarOpen">Attendance</span>
    </a>

    <!-- Academic Section Header (hidden when collapsed) -->
    <div x-show="leftSidebarOpen" class="px-3 py-2 mt-6 text-[10px] font-bold uppercase tracking-widest text-dim">
      Academic
    </div>

    <!-- Subject Assignments -->
    <a href="{%url 'portal:subject-assignments' %}"
       class="flex items-center gap-3 px-3 py-2.5 rounded-md text-dim hover:bg-white/5 hover:text-white font-medium text-sm transition-all group whitespace-nowrap"
       :class="leftSidebarOpen ? 'hover:bg-white/10' : 'justify-center'">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
        <line x1="16" y1="13" x2="8" y2="13" />
      </svg>
      <span x-show="leftSidebarOpen" class="flex-1">Subject Assignments</span>
      <span x-show="leftSidebarOpen" class="ml-auto bg-warning/10 text-warning text-[10px] font-bold px-2 py-0.5 rounded-full border border-warning/20">5</span>
    </a>

    <!-- Results & Grades -->
    <a href="{%url 'portal:results-view' %}"
       class="flex items-center gap-3 px-3 py-2.5 rounded-md text-dim hover:bg-white/5 hover:text-white font-medium text-sm transition-all group whitespace-nowrap"
       :class="leftSidebarOpen ? 'hover:bg-white/10' : 'justify-center'">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M9 11l3 3L22 4" />
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
      </svg>
      <span x-show="leftSidebarOpen">Results & Grades</span>
    </a>

    <!-- Announcements -->
    <a href="#"
       class="flex items-center gap-3 px-3 py-2.5 rounded-md text-dim hover:bg-white/5 hover:text-white font-medium text-sm transition-all group whitespace-nowrap"
       :class="leftSidebarOpen ? 'hover:bg-white/10' : 'justify-center'">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      <span x-show="leftSidebarOpen">Announcements</span>
    </a>

    <!-- Account Section Header (hidden when collapsed) -->
    <div x-show="leftSidebarOpen" class="px-3 py-2 mt-6 text-[10px] font-bold uppercase tracking-widest text-dim">
      Account
    </div>

    <!-- Profile -->
    <a href="#"
       class="flex items-center gap-3 px-3 py-2.5 rounded-md text-dim hover:bg-white/5 hover:text-white font-medium text-sm transition-all group whitespace-nowrap"
       :class="leftSidebarOpen ? 'hover:bg-white/10' : 'justify-center'">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="8" r="4" />
        <path d="M6 20v-2a6 6 0 0 1 12 0v2" />
      </svg>
      <span x-show="leftSidebarOpen">Profile</span>
    </a>

    <!-- Logout -->
    <form action="{% url 'users:logout' %}" method="post"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-danger hover:bg-danger/10 font-medium text-sm transition-all group whitespace-nowrap"
          :class="leftSidebarOpen ? 'hover:bg-danger/10' : 'justify-center'">
      {% csrf_token %}
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      <button type="submit" x-show="leftSidebarOpen">Logout</button>
    </form>
  </nav>
</aside>
