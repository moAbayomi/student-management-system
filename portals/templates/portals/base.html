{%load static %} {% load static tailwind_tags %} {% load django_htmx %}
<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>{%block title%}{%endblock%}</title>
		<link rel="stylesheet" href="{% static 'css/dist/styles.css' %}" />

		{% htmx_script %} {%tailwind_css%}
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

		<script src="{% static 'js/plotly-3.5.0.min.js' %}"></script>
		<style>
			@import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap");
			body {
				font-family: "Inter", sans-serif;
			}
		</style>
	</head>
	<body
		class="bg-background text-main h-screen overflow-hidden antialiased"
		hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'
		hx-indicator="#htmx-loading"
		x-data="{ selectedRow: null, openModal: false, toggleRightBar: false, leftSidebarOpen: window.innerWidth >= 1024 }">
		<div
			class="drawer lg:drawer-open"
			:class="{ 'drawer-open': leftSidebarOpen }">
			<input
				id="left-drawer"
				type="checkbox"
				class="drawer-toggle"
				x-model="leftSidebarOpen" />

			<!-- Content area (also wraps right drawer) -->
			<div class="drawer-content flex flex-col h-screen overflow-hidden">
				<!-- Right drawer -->
				<div
					class="drawer drawer-end h-full"
					:class="{ 'drawer-open': toggleRightBar }">
					<input
						id="right-drawer"
						type="checkbox"
						class="drawer-toggle"
						x-model="toggleRightBar" />

					<!-- Main content -->
					<div class="drawer-content flex flex-col h-full min-h-0">
						<!-- Optional: navbar with toggle buttons -->
						<nav class="navbar bg-background shrink-0">
							<!-- Toggle left sidebar (visible on mobile only) -->
							<label
								for="left-drawer"
								class="btn btn-ghost drawer-button lg:hidden">
								{%include 'portals/partials/icons/panel-left-open.html' %}
							</label>
							<!-- Toggle right sidebar -->
							<div class="flex-1"></div>
							<label for="right-drawer" class="btn btn-ghost drawer-button">
								Details
							</label>
						</nav>

						<!-- Main content block -->
						<main class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth">
							{% block content %}{% endblock %}
						</main>
					</div>

					<!-- Right sidebar overlay + panel -->
					<div class="drawer-side z-40">
						<label for="right-drawer" class="drawer-overlay"></label>
						<aside class="bg-surface text-main min-h-full p-6 shadow-xl mx-auto">
							{% block right_sidebar %}{% endblock %}
						</aside>
					</div>
				</div>
			</div>

			<!-- Left sidebar overlay + panel -->
			<div class="drawer-side z-50">
				<label for="left-drawer" class="drawer-overlay"></label>
				<aside
					class="text-white min-h-full overflow-y-auto is-drawer-close:w-14 is-drawer-open:w-64 transition-all duration-300">
					{% block aside %}{% endblock %}
				</aside>
			</div>
		</div>

		<div id="modal-container"></div>

		<script>
			document.body.addEventListener("keydown", (e) => {
				if (e.key === "Escape") {
					document.getElementById("modal-container").innerHTML = "";
				}
			});
		</script>

		<script>
			function switchTab(el, panelId) {
				document
					.querySelectorAll(".tab-item")
					.forEach((t) => t.classList.remove("active"));
				document
					.querySelectorAll(".content-area")
					.forEach((p) => p.classList.remove("active"));
				el.classList.add("active");
				document.getElementById(panelId).classList.add("active");
			}
		</script>
	</body>
</html>
