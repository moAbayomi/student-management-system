<div
			id="arm-card-{{arm.id}}"
			class="p-3 border rounded-[var(--radius-lg)] transition-colors"
			@click="activeArm='{{arm.id}}'"
			:class="activeArm === '{{arm.id}}' ? 'border-amber-500/50 ring-2 ring-amber-100' : 'border-[var(--color-border-light)] hover:border-[var(--color-primary)]'">
			<div class="flex justify-between items-start mb-1">
				<span class="text-[13px] font-bold text-[var(--color-main)]"
					>{{arm}}</span
				>
				<span
					class="text-[9px] font-bold px-1.5 py-0.5 bg-green-50 text-green-700 rounded-full"
					>40 students</span
				>
			</div>
			<div class="text-[10.5px] font-bold text-amber-700 mb-1">
				Mr. Femi (Form) · Rm 14
			</div>
			<div class="text-[10px] text-[var(--color-muted)] mb-3 font-medium">
				9 subjects · 36 periods/wk
			</div>
			<div class="flex gap-1.5">
				<button
					class="flex-1 py-1 text-[9px] font-bold uppercase bg-amber-100 text-amber-700 border border-amber-200 rounded">
					Viewing ✓
				</button>
				<button
				hx-delete="{%url 'portal:arm-delete' arm.id %}"
				hx-target="#arm-card-{{arm.id}}"
				hx-swap="outerHTML"
				hx-confirm="are you sure you want to delete this arm?"
					class="px-2 py-1 text-[9px] font-bold uppercase text-red-600 hover:bg-red-50 rounded">
					Delete
				</button>
			</div>
		</div>
