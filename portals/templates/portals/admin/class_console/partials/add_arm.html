<div id="modal-container"
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm"
     role="dialog" aria-modal="true">
  <div class="bg-white border border-neutral-200 rounded-xl w-full shadow-2xl flex flex-col my-auto mx-auto">
    <div class="p-6">
      <h3 class="text-lg font-bold mb-4">Add New Arm for {{ level.get_name_display }}</h3>
      <form hx-post="{% url 'portal:add-arm' level.id %}"
            hx-target="#arms-grid-{{ level.id }}"
            hx-swap="beforeend">
        {% csrf_token %}
        <input type="hidden" name="level_id" value="{{ level.id }}" />
        <div class="form-control w-full mb-3">
          <label class="label-text text-xs font-bold text-neutral-500 uppercase mb-1.5">
            Arm Name <span class="text-red-500">*</span>
          </label>
          {{ form.name }}
          {% if form.name.errors %}
            <p class="text-red-500 text-[10px] mt-1">{{ form.name.errors.0 }}</p>
          {% endif %}
        </div>
        <div class="flex justify-end gap-2 mt-4">
          <button type="button" class="btn btn-sm btn-outline"
                  @click="document.getElementById('modal-container').innerHTML = ''">
            Cancel
          </button>
          <button type="submit" class="btn btn-sm btn-neutral">Add Arm</button>
        </div>
      </form>
    </div>
  </div>
</div>
