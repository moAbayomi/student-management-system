<form method="post"
hx-post="{{request.path}}"
x-data="{
	password: '',
	password_confirm: '',

	get passwords_match() {
		return this.password != '' && this.password == this.password_confirm;
	},
	showError: false,
	submitOnboarding() {
		if (!this.passwords_match) {
			this.showError = true;
			return;
		}
		this.showError = false;
		htmx.trigger('#onboarding-form', 'submit');

	}
}"
>
	{% csrf_token %}
	<input type="password" name="password" x-model="password" placeholder="New password" required />
	<input
		type="password"
		x-model="password"
		name="password_confirm"
		placeholder="Confirm password"
		required />
		<p x-model="showError" style="color:red">passwords do not match or is empty</p>
		{%if error%}
		<p>{{error}}</p>
		{%endif%}
	<button type="submit" @click="submitOnboarding()">Set Password</button>
</form>
