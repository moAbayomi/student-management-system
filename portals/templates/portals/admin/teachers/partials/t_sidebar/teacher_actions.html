<div x-show="subjectTab==='actions' && selectedRow !== null" class="p-lg space-y-2">
			<div
				class="text-[10px] font-bold text-muted uppercase tracking-widest mb-3">
				Profile
			</div>

			<a
				:href="'/portal/teachers/' + (selectedTeacher?.id ?? 14) + '/'"
				class="flex items-center gap-3 w-full px-3 py-2.5 border border-border-light rounded-md bg-white hover:bg-background transition-colors group">
				<div
					class="w-7 h-7 rounded bg-info-light flex items-center justify-center flex-shrink-0">
					<svg
						class="w-3.5 h-3.5 text-info"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						viewBox="0 0 24 24">
						<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
						<circle cx="12" cy="12" r="3" />
					</svg>
				</div>
				<div class="flex-1 min-w-0">
					<div class="text-[12px] font-bold text-main">View Full Profile</div>
					<div class="text-[10.5px] text-muted">
						Results, schedule, attendance
					</div>
				</div>
				<svg
					class="w-3.5 h-3.5 text-dim group-hover:text-main transition-colors"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					viewBox="0 0 24 24">
					<polyline points="9 18 15 12 9 6" />
				</svg>
			</a>

			<button
				hx-get=""
				hx-target="#modal-container"
				class="flex items-center gap-3 w-full px-3 py-2.5 border border-border-light rounded-md bg-white hover:bg-background transition-colors group text-left">
				<div
					class="w-7 h-7 rounded bg-background flex items-center justify-center flex-shrink-0">
					<svg
						class="w-3.5 h-3.5 text-muted"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						viewBox="0 0 24 24">
						<path
							d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
						<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z" />
					</svg>
				</div>
				<div class="flex-1 min-w-0">
					<div class="text-[12px] font-bold text-main">Edit Details</div>
					<div class="text-[10.5px] text-muted">
						Personal &amp; professional info
					</div>
				</div>
				<svg
					class="w-3.5 h-3.5 text-dim group-hover:text-main transition-colors"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					viewBox="0 0 24 24">
					<polyline points="9 18 15 12 9 6" />
				</svg>
			</button>

			<div
				class="text-[10px] font-bold text-muted uppercase tracking-widest mb-2 pt-2">
				Communication
			</div>

			<button
				class="flex items-center gap-3 w-full px-3 py-2.5 border border-border-light rounded-md bg-white hover:bg-background transition-colors group text-left">
				<div
					class="w-7 h-7 rounded bg-success-light flex items-center justify-center flex-shrink-0">
					<svg
						class="w-3.5 h-3.5 text-success"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						viewBox="0 0 24 24">
						<path
							d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.19 13 19.79 19.79 0 0 1 1.08 4.18 2 2 0 0 1 3.05 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
					</svg>
				</div>
				<div class="flex-1 min-w-0">
					<div class="text-[12px] font-bold text-main">Call Teacher</div>
					<div
						class="text-[10.5px] text-muted"
						x-text="selectedTeacher?.phone ?? '+234 806 123 4567'"></div>
				</div>
			</button>

			<button
				hx-post=""
				hx-swap="outerHTML"
				hx-target="this"
				class="flex items-center gap-3 w-full px-3 py-2.5 border border-warning/30 rounded-md bg-warning-light hover:bg-warning/20 transition-colors group text-left">
				<div
					class="w-7 h-7 rounded bg-warning/20 flex items-center justify-center flex-shrink-0">
					<svg
						class="w-3.5 h-3.5 text-warning"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						viewBox="0 0 24 24">
						<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
						<path d="M13.73 21a2 2 0 0 1-3.46 0" />
					</svg>
				</div>
				<div class="flex-1 min-w-0">
					<div class="text-[12px] font-bold text-warning">
						Send Results Nudge
					</div>
					<div class="text-[10.5px] text-muted">
						2 classes pending submission
					</div>
				</div>
			</button>

			<div
				class="text-[10px] font-bold text-muted uppercase tracking-widest mb-2 pt-2">
				Admin
			</div>

			<button
				hx-get=""
				hx-target="#modal-container"
				class="flex items-center gap-3 w-full px-3 py-2.5 border border-border-light rounded-md bg-white hover:bg-background transition-colors group text-left">
				<div
					class="w-7 h-7 rounded bg-background flex items-center justify-center flex-shrink-0">
					<svg
						class="w-3.5 h-3.5 text-muted"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						viewBox="0 0 24 24">
						<rect x="3" y="4" width="18" height="18" rx="2" />
						<line x1="16" y1="2" x2="16" y2="6" />
						<line x1="8" y1="2" x2="8" y2="6" />
						<line x1="3" y1="10" x2="21" y2="10" />
					</svg>
				</div>
				<div class="flex-1 min-w-0">
					<div class="text-[12px] font-bold text-main">Change Form Class</div>
					<div class="text-[10.5px] text-muted">Currently: SS 2A</div>
				</div>
				<svg
					class="w-3.5 h-3.5 text-dim group-hover:text-main transition-colors"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					viewBox="0 0 24 24">
					<polyline points="9 18 15 12 9 6" />
				</svg>
			</button>

			<button
				hx-get=""
				hx-target="#modal-container"
				class="flex items-center gap-3 w-full px-3 py-2.5 border border-border-light rounded-md bg-white hover:bg-background transition-colors group text-left">
				<div
					class="w-7 h-7 rounded bg-background flex items-center justify-center flex-shrink-0">
					<svg
						class="w-3.5 h-3.5 text-muted"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						viewBox="0 0 24 24">
						<rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
						<path d="M7 11V7a5 5 0 0 1 10 0v4" />
					</svg>
				</div>
				<div class="flex-1 min-w-0">
					<div class="text-[12px] font-bold text-main">
						Reset Portal Password
					</div>
					<div class="text-[10.5px] text-muted">Generate a new login link</div>
				</div>
				<svg
					class="w-3.5 h-3.5 text-dim group-hover:text-main transition-colors"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					viewBox="0 0 24 24">
					<polyline points="9 18 15 12 9 6" />
				</svg>
			</button>

			<button
				hx-get=""
				class="flex items-center gap-3 w-full px-3 py-2.5 border border-border-light rounded-md bg-white hover:bg-background transition-colors group text-left">
				<div
					class="w-7 h-7 rounded bg-background flex items-center justify-center flex-shrink-0">
					<svg
						class="w-3.5 h-3.5 text-muted"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						viewBox="0 0 24 24">
						<polyline points="6 9 6 2 18 2 18 9" />
						<path
							d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
						<rect x="6" y="14" width="12" height="8" />
					</svg>
				</div>
				<div class="flex-1 min-w-0">
					<div class="text-[12px] font-bold text-main">Print Profile Sheet</div>
					<div class="text-[10.5px] text-muted">PDF export of staff record</div>
				</div>
			</button>

			<button
				hx-post=""
				hx-confirm="Deactivate this teacher? They will lose portal access."
				class="flex items-center gap-3 w-full px-3 py-2.5 border border-danger/20 rounded-md bg-danger-light hover:bg-danger/10 transition-colors group text-left mt-1">
				<div
					class="w-7 h-7 rounded bg-danger/10 flex items-center justify-center flex-shrink-0">
					<svg
						class="w-3.5 h-3.5 text-danger"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						viewBox="0 0 24 24">
						<circle cx="12" cy="12" r="10" />
						<line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
					</svg>
				</div>
				<div class="flex-1 min-w-0">
					<div class="text-[12px] font-bold text-danger">
						Deactivate Teacher
					</div>
					<div class="text-[10.5px] text-muted">Removes portal access</div>
				</div>
			</button>
		</div>
