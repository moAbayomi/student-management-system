<form
	hx-post="{%url 'portal:assign-subject-assignment' %}"
	class="space-y-3">
	{% csrf_token %}
	<input type="hidden" name="teacher_id" :value="{{teacher.id}}" />

	<div>
		<label
			class="text-[10px] font-bold text-muted uppercase tracking-widest block mb-1.5"
			>Subject</label
		>
        <select
			name="subject_id"
			class="w-full text-[12px] font-medium text-main bg-white border border-border rounded-md px-3 py-2 focus:outline-none focus:border-surface-dark">
			<option value="">Select subject…</option>
            {%for sub in subjects%}
            <option value="{{sub.id}}">{{sub.name}}</option>
            {%endfor%}
		</select>
	</div>

	<div>
		<label
			class="text-[10px] font-bold text-muted uppercase tracking-widest block mb-1.5"
			>Class Level</label
		>
		<select
			name="class_level_id"
			class="w-full text-[12px] font-medium text-main bg-white border border-border rounded-md px-3 py-2 focus:outline-none focus:border-surface-dark"
			hx-get="{%url 'portal:load-arms-for-class' %}"
			hx-target="#arm-checkboxes"
			hx-trigger="change"
			hx-include="[name=class_level_id]">
			<option value="">Select class level…</option>
			{%for class_level in all_classes%}
            <option  value="{{class_level.id}}">{{class_level.name}}</option>
            {%endfor%}

		</select>
	</div>

	<div>
		<label
			class="text-[10px] font-bold text-muted uppercase tracking-widest block mb-1.5"
			>Arms</label
		>
		<div id="arm-checkboxes" class="flex flex-wrap gap-2"></div>
	</div>

	

	<div class="pt-1">
		
		<button
			type="submit"
			class="w-full py-2 bg-surface-dark text-white rounded-md text-[11.5px] font-bold hover:opacity-90 transition-opacity">
			Confirm Assignment
		</button>
		<button
			type="button"
			class="w-full mt-1.5 py-2 border border-border rounded-md text-[11.5px] font-semibold text-muted hover:bg-background transition-colors">
			Cancel
		</button>
	</div>
</form>
