<form id="onboarding-form" method="post"
  hx-post="{{ request.path }}"
x-data="{
password: '',
password_confirm: '',

get passwords_match() {
	return this.password == this.password_confirm && this.password !== '';
},

showError: false,

submitOnboarding() {
	if (!this.passwords_match) {
		this.showError = true;
		return;
	};
	this.showError = false;
	htmx.trigger('#onboarding-form', 'submit');
}
}"
>
	{% csrf_token %}
	<input type="password" x-model="password" name="password" placeholder="New password" required />
	<input
		type="password"
		x-model="password_confirm"
		name="password_confirm"
		placeholder="Confirm password"
		required />
		<p x-model="showError" style="color:red">passwords do not match or are empty</p>
		{%if error%}
		<p style="color:red">{{error}}</p>
		{%endif%}
	<button type="button" @click="submitOnboarding()">Set Password</button>
</form>
