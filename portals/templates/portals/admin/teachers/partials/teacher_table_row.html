<tr
					id="teacher-row-{{teacher.id}}"
					class="hover:bg-[var(--color-background)]/40 transition-colors group"
					hx-get="{%url 'portal:teacher-detail' teacher.id %}"
					hx-target="#teacher-card-right-sidebar"
					hx-swap="outerHTML"
					hx-headers='{"Trigger-Source": "sidebar-update"}'
					{%if oob%}
					hx-swap-oob="#teacher-row-{{teacher.id}}"
					{%endif%}
					@click="selectedRow={{teacher.id}}, toggleRightBar=true">
					<td class="p-4 text-center">
						<input
							type="checkbox"
							class="w-3.5 h-3.5 accent-[var(--color-warning)]" />
					</td>
					<td class="p-4">
						<div class="flex items-center gap-3">
							<div
								class="w-8 h-8 rounded bg-[var(--color-info-light)] flex items-center justify-center font-bold text-[var(--color-info)] text-[11px]">
								FO
							</div>
							<div class="flex flex-col">
								<span
									class="text-xs font-bold text-[var(--color-main)] leading-none"
									>{{teacher.user.get_full_name}}</span
								>
								<span
									class="text-[10px] font-bold text-[var(--color-dim)] mt-1 tracking-tight"
									>#TCH-001 · Sciences</span
								>
							</div>
						</div>
					</td>
					<td class="p-4">
						<span
							class="px-2 py-0.5 rounded-full bg-[var(--color-info-light)] text-[var(--color-info)] text-[10px] font-bold"
							>Sciences</span
						>
					</td>
					<td class="p-4">
						<div class="flex flex-col">
							<span class="text-xs font-bold text-[var(--color-muted)]"
								>Teacher</span
							>
							{%for cls in teacher.user.class_teacher_of.all%}
							<span class="text-[10px] text-[var(--color-dim)] font-medium"
								>Form: {{cls}}</span
							>
							{%endfor%}
						</div>
					</td>
					<td class="p-4">
						<div class="flex items-center gap-2">
							<div
								class="w-16 h-1.5 bg-[var(--color-background)] rounded-full overflow-hidden">
								<div class="bg-[var(--color-danger)] h-full w-[93%]"></div>
							</div>
							<span class="text-[10px] font-bold text-[var(--color-danger)]"
								>28/30h</span
							>
						</div>
					</td>
					<td class="p-4">
						<span
							class="flex items-center gap-1.5 text-[10px] font-bold text-[var(--color-success)] uppercase">
							<span
								class="w-1.5 h-1.5 rounded-full bg-[var(--color-success)]"></span>
							Active
						</span>
					</td>
					<td class="p-4">
						<div
							class="flex items-center justify-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
							<button
								class="p-1.5 text-[var(--color-dim)] hover:text-[var(--color-primary)] transition-colors">
								<svg
									class="w-3.5 h-3.5"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									viewBox="0 0 24 24">
									<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
									<circle cx="12" cy="12" r="3" />
								</svg>
							</button>
							<button
								class="p-1.5 text-[var(--color-dim)] hover:text-[var(--color-main)] transition-colors">
								<svg
									class="w-3.5 h-3.5"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									viewBox="0 0 24 24">
									<path
										d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
									<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z" />
								</svg>
							</button>
						</div>
					</td>
				</tr>
