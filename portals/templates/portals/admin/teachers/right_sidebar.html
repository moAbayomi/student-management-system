<aside
	id="teacher-side-bar"
	class="h-screen bg-surface flex flex-col sticky top-0 overflow-y-auto custom-scrollbar w-80 flex-shrink-0">
	<div
		id="teacher-card-right-sidebar"
		x-show="selectedRow != null"
		x-cloak x-data="{
		subjectTab: 'assignments'
	}"></div>
	



	<div
		class="p-lg border-b border-border-light bg-background/30"
		x-show="selectedRow == null">
		<h3 class="text-[13px] font-bold text-main mb-3">Advanced Filters</h3>

		<div class="mb-4">
			<label
				class="text-[10px] font-bold text-muted uppercase tracking-widest block mb-2"
				>Free During Period</label
			>
			<div class="grid grid-cols-7 gap-1 items-center">
				<div class="col-start-2 text-[9px] font-bold text-dim text-center">
					P1
				</div>
				<div class="text-[9px] font-bold text-dim text-center">P2</div>
				<div class="text-[9px] font-bold text-dim text-center">P3</div>
				<div class="text-[9px] font-bold text-dim text-center">P4</div>
				<div class="text-[9px] font-bold text-dim text-center">P5</div>
				<div class="text-[9px] font-bold text-dim text-center">P6</div>
				<div class="text-[9px] font-bold text-muted text-right pr-1">Mon</div>
				<div
					class="aspect-square rounded-[2px] bg-success-light border border-success/20 flex items-center justify-center text-[8px] text-success cursor-pointer hover:border-success transition-colors">
					·
				</div>
				<div
					class="aspect-square rounded-[2px] bg-danger-light border border-danger/20 flex items-center justify-center text-[8px] text-danger cursor-pointer hover:border-danger transition-colors">
					✕
				</div>
				<div
					class="aspect-square rounded-[2px] bg-success-light border border-success/20 flex items-center justify-center text-[8px] text-success cursor-pointer hover:border-success transition-colors">
					·
				</div>
				<div
					class="aspect-square rounded-[2px] bg-surface-dark border border-surface-dark flex items-center justify-center text-[8px] text-white cursor-pointer">
					✓
				</div>
				<div
					class="aspect-square rounded-[2px] bg-success-light border border-success/20 flex items-center justify-center text-[8px] text-success cursor-pointer hover:border-success transition-colors">
					·
				</div>
				<div
					class="aspect-square rounded-[2px] bg-danger-light border border-danger/20 flex items-center justify-center text-[8px] text-danger cursor-pointer hover:border-danger transition-colors">
					✕
				</div>
				<div class="text-[9px] font-bold text-muted text-right pr-1">Tue</div>
				<div
					class="aspect-square rounded-[2px] bg-background border border-border-light flex items-center justify-center text-[8px] text-muted cursor-pointer hover:bg-success-light transition-colors">
					·
				</div>
				<div
					class="aspect-square rounded-[2px] bg-success-light border border-success/20 flex items-center justify-center text-[8px] text-success cursor-pointer">
					·
				</div>
				<div
					class="aspect-square rounded-[2px] bg-danger-light border border-danger/20 flex items-center justify-center text-[8px] text-danger cursor-pointer">
					✕
				</div>
				<div
					class="aspect-square rounded-[2px] bg-background border border-border-light flex items-center justify-center text-[8px] text-muted cursor-pointer hover:bg-success-light transition-colors">
					·
				</div>
				<div
					class="aspect-square rounded-[2px] bg-surface-dark border border-surface-dark flex items-center justify-center text-[8px] text-white cursor-pointer">
					✓
				</div>
				<div
					class="aspect-square rounded-[2px] bg-success-light border border-success/20 flex items-center justify-center text-[8px] text-success cursor-pointer">
					·
				</div>
			</div>
		</div>

		<div class="space-y-1 mb-4">
			<label
				class="text-[10px] font-bold text-muted uppercase tracking-widest block mb-2"
				>Department</label
			>
			<div class="flex items-center justify-between cursor-pointer">
				<label
					class="flex items-center gap-2 text-[11.5px] text-main cursor-pointer">
					<input type="checkbox" class="accent-main" checked /> Sciences
				</label>
				<span
					class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-background border border-border-light text-muted"
					>14</span
				>
			</div>
			<div class="flex items-center justify-between cursor-pointer">
				<label
					class="flex items-center gap-2 text-[11.5px] text-main cursor-pointer">
					<input type="checkbox" class="accent-main" /> Humanities
				</label>
				<span
					class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-background border border-border-light text-muted"
					>12</span
				>
			</div>
			<div class="flex items-center justify-between cursor-pointer">
				<label
					class="flex items-center gap-2 text-[11.5px] text-main cursor-pointer">
					<input type="checkbox" class="accent-main" /> Languages
				</label>
				<span
					class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-background border border-border-light text-muted"
					>8</span
				>
			</div>
			<div class="flex items-center justify-between cursor-pointer">
				<label
					class="flex items-center gap-2 text-[11.5px] text-main cursor-pointer">
					<input type="checkbox" class="accent-main" /> Mathematics
				</label>
				<span
					class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-background border border-border-light text-muted"
					>4</span
				>
			</div>
		</div>

		<div class="space-y-1 mb-4">
			<label
				class="text-[10px] font-bold text-muted uppercase tracking-widest block mb-2"
				>Qualification</label
			>
			<div class="flex items-center justify-between cursor-pointer">
				<label
					class="flex items-center gap-2 text-[11.5px] text-main cursor-pointer">
					<input type="checkbox" class="accent-main" checked /> M.Sc
				</label>
				<span
					class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-background border border-border-light text-muted"
					>11</span
				>
			</div>
			<div class="flex items-center justify-between cursor-pointer">
				<label
					class="flex items-center gap-2 text-[11.5px] text-main cursor-pointer">
					<input type="checkbox" class="accent-main" /> B.Ed
				</label>
				<span
					class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-background border border-border-light text-muted"
					>18</span
				>
			</div>
			<div class="flex items-center justify-between cursor-pointer">
				<label
					class="flex items-center gap-2 text-[11.5px] text-main cursor-pointer">
					<input type="checkbox" class="accent-main" /> PGDE
				</label>
				<span
					class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-background border border-border-light text-muted"
					>7</span
				>
			</div>
		</div>

		<div class="space-y-1 mb-4">
			<label
				class="text-[10px] font-bold text-muted uppercase tracking-widest block mb-2"
				>Results Status</label
			>
			<div class="flex items-center justify-between cursor-pointer">
				<label
					class="flex items-center gap-2 text-[11.5px] text-main cursor-pointer">
					<input type="checkbox" class="accent-main" /> Pending submission
				</label>
				<span
					class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-danger-light text-danger border border-danger/20"
					>8</span
				>
			</div>
			<div class="flex items-center justify-between cursor-pointer">
				<label
					class="flex items-center gap-2 text-[11.5px] text-main cursor-pointer">
					<input type="checkbox" class="accent-main" /> All submitted
				</label>
				<span
					class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-background border border-border-light text-muted"
					>30</span
				>
			</div>
		</div>

		<div class="space-y-1 mb-4">
			<label
				class="text-[10px] font-bold text-muted uppercase tracking-widest block mb-2"
				>Workload</label
			>
			<div class="flex items-center justify-between cursor-pointer">
				<label
					class="flex items-center gap-2 text-[11.5px] text-main cursor-pointer">
					<input type="checkbox" class="accent-main" /> Overloaded (&gt;85%)
				</label>
				<span
					class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-danger-light text-danger border border-danger/20"
					>3</span
				>
			</div>
			<div class="flex items-center justify-between cursor-pointer">
				<label
					class="flex items-center gap-2 text-[11.5px] text-main cursor-pointer">
					<input type="checkbox" class="accent-main" /> Under-assigned (&lt;40%)
				</label>
				<span
					class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-warning-light text-warning border border-warning/20"
					>5</span
				>
			</div>
		</div>

		<button
			hx-get=""
			hx-include="[data-filter]"
			hx-target="#teacher-list-container"
			class="w-full py-2 bg-surface-dark text-white rounded-md text-[11.5px] font-bold hover:opacity-90 transition-opacity">
			Apply Filters
		</button>
		<button
			class="w-full mt-1.5 py-2 border border-border-light rounded-md text-[11.5px] font-semibold text-muted hover:bg-background transition-colors">
			Clear All
		</button>
	</div>

	<div class="p-lg" x-show="selectedRow == null">
		<h3 class="text-[13px] font-bold text-main mb-3">By Department</h3>
		<div class="space-y-3">
			<div>
				<div class="flex justify-between items-center mb-1">
					<span
						class="px-1.5 py-0.5 bg-info-light text-info rounded text-[9px] font-bold uppercase"
						>Sciences</span
					>
					<span class="text-[11px] font-bold text-main">14</span>
				</div>
				<div class="h-1.5 w-full bg-background rounded-full overflow-hidden">
					<div class="h-full bg-info" style="width: 37%"></div>
				</div>
			</div>
			<div>
				<div class="flex justify-between items-center mb-1">
					<span
						class="px-1.5 py-0.5 bg-success-light text-success rounded text-[9px] font-bold uppercase"
						>Humanities</span
					>
					<span class="text-[11px] font-bold text-main">12</span>
				</div>
				<div class="h-1.5 w-full bg-background rounded-full overflow-hidden">
					<div class="h-full bg-success" style="width: 32%"></div>
				</div>
			</div>
			<div>
				<div class="flex justify-between items-center mb-1">
					<span
						class="px-1.5 py-0.5 bg-warning-light text-warning rounded text-[9px] font-bold uppercase"
						>Languages</span
					>
					<span class="text-[11px] font-bold text-main">8</span>
				</div>
				<div class="h-1.5 w-full bg-background rounded-full overflow-hidden">
					<div class="h-full bg-warning" style="width: 21%"></div>
				</div>
			</div>
			<div>
				<div class="flex justify-between items-center mb-1">
					<span
						class="px-1.5 py-0.5 bg-background border border-border text-muted rounded text-[9px] font-bold uppercase"
						>Mathematics</span
					>
					<span class="text-[11px] font-bold text-main">4</span>
				</div>
				<div class="h-1.5 w-full bg-background rounded-full overflow-hidden">
					<div class="h-full bg-surface-dark" style="width: 10%"></div>
				</div>
			</div>
		</div>

		<div class="mt-4 pt-3 border-t border-border-light">
			<div
				class="text-[10px] font-bold text-muted uppercase tracking-widest mb-2">
				Results this term
			</div>
			<div class="flex items-center justify-between text-[11.5px] py-1">
				<span class="text-muted">Fully submitted</span>
				<span class="font-bold text-success">30 teachers</span>
			</div>
			<div class="flex items-center justify-between text-[11.5px] py-1">
				<span class="text-muted">Partially submitted</span>
				<span class="font-bold text-warning">5 teachers</span>
			</div>
			<div class="flex items-center justify-between text-[11.5px] py-1">
				<span class="text-muted">Not started</span>
				<span class="font-bold text-danger">3 teachers</span>
			</div>
			<button
				hx-post=""
				hx-confirm="Send a nudge to all 8 teachers with pending results?"
				hx-swap="none"
				class="w-full mt-3 py-2 border border-warning/30 bg-warning-light text-warning rounded-md text-[11.5px] font-bold hover:bg-warning/20 transition-colors flex items-center justify-center gap-2">
				<svg
					class="w-3.5 h-3.5"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					viewBox="0 0 24 24">
					<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
					<path d="M13.73 21a2 2 0 0 1-3.46 0" />
				</svg>
				Nudge all 8 pending
			</button>
		</div>
	</div>
</aside>
